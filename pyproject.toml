[project]
name = "interlatch"
dynamic = ["readme", "version"]  # the version comes from the latest vX.Y.Z git tag (hatch-vcs)
description = "Shared memory for your coding agents: records every session (Claude Code, Codex, Copilot, Bob, Antigravity) locally and keeps what they learned, each lesson linked to the session it came from."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Tam" }]
keywords = ["claude-code", "codex", "github-copilot", "coding-agents", "mcp", "knowledge-base", "transcripts", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://interlatch.com"
Documentation = "https://interlatch.com/docs/"
Repository = "https://github.com/Chatixia-AI/interlatch"
Issues = "https://github.com/Chatixia-AI/interlatch/issues"

[project.scripts]
interlatch = "chronicle.cli:main"
chronicle = "chronicle.cli:main"  # the command's name before the rename (Chronicle), kept as an alias

[project.optional-dependencies]
app = [
    "pyobjc-framework-servicemanagement>=11 ; sys_platform == 'darwin'",
    "pywebview>=6.2,<7 ; sys_platform == 'darwin'",  # desktop.py extends its Cocoa app delegate
]
# on a hub that keeps the team's record in Postgres ([hub] store = "postgres"); members never need it
team = ["psycopg[binary]>=3.2"]
# a copy of this archive in a Postgres database you choose ([mirror] to = "postgres")
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# A tagged commit builds as that version (v0.7.0 -> 0.7.0); later commits as the next patch's dev release
# (0.7.1.dev3+g1a2b3c4). A copy without git history, such as a GitHub source zip, builds as 0.0.0.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

# rebuild the editable install's metadata when a commit or tag changes the version
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# PyPI shows the README without the repository around it: make its relative images and links absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src="|\]\()(?!https?://|#)([^")]+\.(?:png|svg|jpg|gif))'
replacement = '\1https://raw.githubusercontent.com/Chatixia-AI/interlatch/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(href="|\]\()(?!https?://|#)([^")]+)'
replacement = '\1https://github.com/Chatixia-AI/interlatch/blob/main/\2'

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

# ee/ is under its own enterprise license and builds its own package; keep it out of the MIT sdist
[tool.hatch.build.targets.sdist]
exclude = ["/ee"]

[dependency-groups]
build = [
    "pillow>=11",
    "pyinstaller>=6.11",
]
dev = ["pytest>=8"]
docs = [
    "mkdocs-material>=9.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# likely bugs only (pyflakes, bugbear, syntax and runtime errors); the code keeps its own layout, so no formatter
select = ["F", "B", "E9", "PLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
