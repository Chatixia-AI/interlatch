name: CI

# Every pull request and every push to main: the test suite, the install on Windows, the Postgres tests against a real
# database, known vulnerabilities in the locked dependencies, the pre-commit hooks (.pre-commit-config.yaml), and the
# hub's Docker image (docker/) built from this checkout.
# `test` and `windows` are required checks on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv run --locked pytest -q

  windows:
    # Windows: its own tests (the rest of the suite assumes macOS or Linux), then the install on a real Windows
    # (tests/windows_smoke.py): the hooks through Git Bash and PowerShell, the Task Scheduler tasks and the dashboard
    # they start, a reinstall while it all runs, and uninstall
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv run --locked pytest -q tests/test_windows.py
      - name: Install the wheel as a uv tool, as a user would
        # where uv's installer and uv tool put things on a user's PC, which the Task Scheduler tasks find too
        # (setup-uv points uv's tool folders at temporary ones through variables that tasks don't see)
        run: |
          unset UV_TOOL_DIR UV_TOOL_BIN_DIR
          mkdir -p ~/.local/bin
          cp "$(dirname "$(command -v uv)")/uv.exe" ~/.local/bin/uv.exe
          uv build --wheel -o "$RUNNER_TEMP/dist"
          ~/.local/bin/uv tool install "$(ls "$RUNNER_TEMP"/dist/*.whl)"
          cygpath -w ~/.local/bin >> "$GITHUB_PATH"
      - name: Set up, record, run in the background, update, uninstall
        # without the project's environment, whose own interlatch.exe would come first on PATH
        run: |
          unset UV_TOOL_DIR UV_TOOL_BIN_DIR
          rm -rf .venv
          cd "$RUNNER_TEMP" && ~/.local/bin/uv run --no-project python "$GITHUB_WORKSPACE/tests/windows_smoke.py"

  postgres:
    # The team store and the mirror against a real Postgres: their tests skip without one (INTERLATCH_TEST_PG; set
    # under its name before the rename too, CHRONICLE_TEST_PG, which a branch from before it reads)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chronicle
          POSTGRES_PASSWORD: chronicle
          POSTGRES_DB: chronicle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chronicle" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: The Postgres tests, none of them skipped
        run: |
          printf 'PGHOST=127.0.0.1\nPGPORT=5432\nPGDATABASE=chronicle\nPGUSER=chronicle\nPGPASSWORD=chronicle\nPGSSLMODE=disable\n' > "$RUNNER_TEMP/pg.env"
          chmod 600 "$RUNNER_TEMP/pg.env"
          INTERLATCH_TEST_PG="$RUNNER_TEMP/pg.env" CHRONICLE_TEST_PG="$RUNNER_TEMP/pg.env" \
            uv run --locked --extra postgres pytest -q -rs tests/test_team.py tests/test_mirror.py | tee "$RUNNER_TEMP/pytest.out"
          if grep -q skipped "$RUNNER_TEMP/pytest.out"; then
            echo "::error::a Postgres test was skipped"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: pip-audit on uv.lock
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Build the hub's image from this checkout
        run: |
          uv build --wheel -o docker/wheels
          docker build -t interlatch-hub:ci docker
      - name: It refuses to start without an admin
        run: |
          if docker run --rm -e INTERLATCH_HUB_URL=https://hub.example.com interlatch-hub:ci; then
            echo "::error::the hub started without an admin"
            exit 1
          fi
      - name: With one, it becomes healthy and asks everyone to sign in
        run: |
          docker run -d --name hub -p 127.0.0.1:11524:11524 -e INTERLATCH_HUB_URL=https://hub.example.com \
            -e INTERLATCH_ADMIN_EMAIL=ada@example.com interlatch-hub:ci
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hub)" = healthy ] && break
            sleep 2
          done
          docker logs hub
          docker inspect -f '{{.State.Health.Status}}' hub | grep -qx healthy
          docker logs hub | grep -q '/signin?code='
          docker logs hub | grep -q 'Interlatch hub is up: https://hub.example.com'
          if docker logs hub 2>&1 | grep -q '127.0.0.1'; then  # an editor on the server would forward it
            echo "::error::the hub's log names 127.0.0.1"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: hub.example.com' http://127.0.0.1:11524/api/people)
          if [ "$code" != 401 ]; then
            echo "::error::/api/people answered $code without a sign-in"
            exit 1
          fi
      - name: A hub set up before the rename, with CHRONICLE_* variables, starts the same way
        run: |
          docker run -d --name old -e CHRONICLE_HUB_URL=https://old.example.com -e CHRONICLE_ADMIN_EMAIL=ada@example.com \
            interlatch-hub:ci
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' old)" = healthy ] && break
            sleep 2
          done
          docker logs old
          docker inspect -f '{{.State.Health.Status}}' old | grep -qx healthy
          docker logs old | grep -q 'hub is up: https://old.example.com'
      - name: compose.yaml reads a .env from before the rename, and keeps that hub's volumes
        run: |
          printf 'CHRONICLE_DOMAIN=old.example.com\nCHRONICLE_ADMIN_EMAIL=ada@example.com\nPOSTGRES_PASSWORD=x\n' > "$RUNNER_TEMP/old.env"
          docker compose -f docker/compose.yaml --env-file "$RUNNER_TEMP/old.env" config > "$RUNNER_TEMP/compose.yaml"
          grep -q 'INTERLATCH_HUB_URL: https://old.example.com' "$RUNNER_TEMP/compose.yaml"
          grep -q 'CHRONICLE_DOMAIN: old.example.com' "$RUNNER_TEMP/compose.yaml"  # what that hub's Caddyfile reads
          grep -q 'name: chronicle_hub-data' "$RUNNER_TEMP/compose.yaml"
