name: Release

# Releasing is one button: Actions → Release → Run workflow on main, and pick patch, minor or major. The version
# lives in the git tags (hatch-vcs), so nothing is committed first. The run works out the next version from the
# latest vX.Y.Z tag, runs the tests, creates the tag and the GitHub release (its notes are the changelog.d/ files
# added since the previous tag), publishes interlatch to PyPI (trusted publishing, no token), publishes the hub's
# image ghcr.io/chatixia-ai/interlatch-hub (docker/, built from that PyPI release; also as chronicle-hub, its name
# before the rename), attaches Interlatch-X.Y.Z-arm64.dmg, publishes the VS Code extension when its own version went
# up (the vscode job says what it needs), and opens a pull request that moves those files' lines into CHANGELOG.md
# under "## X.Y.Z (date)". The next release doesn't wait for that pull request: a file merged after the tag is
# simply new since it.
# "dry run" (the default) runs the tests and keeps the DMG as a workflow artifact, publishing nothing.
# Publishing a release tagged vX.Y.Z on GitHub by hand runs the same tests, PyPI and DMG jobs.
#
# PyPI takes interlatch only from the trusted publisher it lists for it: this repository, release.yml and the
# environment pypi. (agents-chronicle, the name before the rename, is no longer on PyPI.)
#
# The DMG is signed and notarized when these repository secrets exist, otherwise it is ad-hoc signed:
#   MACOS_CERT_P12            base64 of the "Developer ID Application" certificate + key (.p12)
#   MACOS_CERT_PASSWORD       its export password
#   MACOS_CODESIGN_IDENTITY   e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up (dry run publishes nothing)
        type: choice
        options: [dry run, patch, minor, major]
        default: dry run

permissions: {}  # each job asks for what it needs

concurrency:
  group: release  # one release at a time, so two runs never pick the same version
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}  # empty on a dry run
      create: ${{ steps.plan.outputs.create }}    # "true" when this run creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every tag, to find the latest
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = release ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag $RELEASE_TAG is not vX.Y.Z"
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [ "$BUMP" != "dry run" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases come from main; this run is on $GITHUB_REF"
              exit 1
            fi
            VERSION=$(python3 packaging/release.py next "$BUMP")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "Releasing Interlatch **$VERSION** ($BUMP)" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: plan
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the version comes from the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # a release never restores a cache another run could have written
      - run: uv run --locked pytest -q

  release:
    needs: [plan, test]
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the notes are the changelog.d/ files added since the previous tag
          persist-credentials: false
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 packaging/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Interlatch $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  pypi:
    needs: [plan, test, release]
    # on a published release the release job is skipped: the tag is already there
    if: >-
      !cancelled() && needs.plan.outputs.version != '' && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # checkout
      id-token: write  # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0  # the version comes from the tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # a release never restores a cache another run could have written
      - run: uv build
      - name: Check the build carries the release's version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls dist
          if [ ! -f "dist/interlatch-$VERSION-py3-none-any.whl" ]; then
            echo "::error::The build is not version $VERSION"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  image:
    needs: [plan, pypi]
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # push to ghcr.io
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ghcr.io/chatixia-ai/interlatch-hub
      # its name before the rename: a hub whose compose.yaml still names it keeps getting each release with
      # `docker compose pull`, which is what the dashboard tells a container to do
      OLD_IMAGE: ghcr.io/chatixia-ai/chronicle-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false
      - name: Wait until PyPI serves the release
        run: |
          for _ in $(seq 1 30); do
            if python3 -m pip download --quiet --no-deps --no-cache-dir --dest "$RUNNER_TEMP/probe" \
                "interlatch==$VERSION"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::PyPI does not serve interlatch $VERSION after 5 minutes"
          exit 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: INTERLATCH_VERSION=${{ needs.plan.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.OLD_IMAGE }}:${{ needs.plan.outputs.version }}
            ${{ env.OLD_IMAGE }}:latest
          push: true

  vscode:
    # The VS Code extension (vscode-extension/): Chatixia-AI.interlatch on the Marketplace, and on Open VSX for the
    # editors that install from there (Cursor, Windsurf, Antigravity, VSCodium). It has its own version, in its
    # package.json: a version already published is skipped, so a release publishes the extension only when that
    # version went up. Repository secrets: VSCE_PAT, an Azure DevOps token with Marketplace (Manage) for the
    # Chatixia-AI publisher; OVSX_PAT, an open-vsx.org token. Without them the extension is packaged, not published.
    needs: [plan, test, release]
    if: >-
      !cancelled() && needs.plan.outputs.version != '' && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_VSCE: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22  # vsce and ovsx need 22 or later
          package-manager-cache: false  # nothing to restore, and a release never restores a cache
      - name: Package
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce@4.0.0 package -o "$RUNNER_TEMP/interlatch.vsix"
      - name: Publish to the Marketplace
        if: env.HAS_VSCE == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath "$RUNNER_TEMP/interlatch.vsix" --skip-duplicate
      - name: Publish to Open VSX
        if: env.HAS_OVSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish "$RUNNER_TEMP/interlatch.vsix" --skip-duplicate
      - name: Say what wasn't published
        if: env.HAS_VSCE != 'true' || env.HAS_OVSX != 'true'
        run: |
          [ "$HAS_VSCE" = true ] || echo "::notice::No VSCE_PAT secret: the extension isn't published to the Marketplace"
          [ "$HAS_OVSX" = true ] || echo "::notice::No OVSX_PAT secret: the extension isn't published to Open VSX"

  macos-app:
    needs: [plan, test, release]
    if: >-
      !cancelled() && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: macos-15  # Apple silicon; PyInstaller cannot cross-build, so an Intel build needs an Intel runner
    permissions:
      contents: write  # upload the DMG to the release
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      VERSION: ${{ needs.plan.outputs.version }}  # empty on a dry run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.version != '' && format('v{0}', needs.plan.outputs.version) || github.sha }}
          fetch-depth: 0  # the version comes from the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # a release never restores a cache another run could have written

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build Interlatch.app and DMG
        env:
          INTERLATCH_CODESIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./packaging/macos/build.sh

      - name: Attach DMG to the release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/Interlatch-*.dmg --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep DMG as a workflow artifact
        if: env.VERSION == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Interlatch-dmg
          path: dist/Interlatch-*.dmg

  changelog:
    needs: [plan, pypi]
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the branch
      pull-requests: write  # open the pull request
      actions: write        # start CI on the branch: a push made with this token starts no workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # the tags, to find which changelog.d/ files this release took
          persist-credentials: false
      - name: Open a pull request that moves the release's changelog.d/ files into CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          BRANCH="changelog-$VERSION"
          python3 packaging/release.py fold "$VERSION" "$(date -u +%F)" > "$RUNNER_TEMP/released.txt"
          # one commit through the API: the new CHANGELOG.md, minus the files it took (ones merged since stay)
          TREE=$(jq -n --rawfile changelog CHANGELOG.md --rawfile released "$RUNNER_TEMP/released.txt" \
              --arg base "$(git rev-parse 'HEAD^{tree}')" \
              '{base_tree: $base, tree: ([{path: "CHANGELOG.md", mode: "100644", type: "blob", content: $changelog}]
                + [$released | split("\n")[] | select(. != "") | {path: ., mode: "100644", type: "blob", sha: null}])}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - -q .sha)
          COMMIT=$(jq -n --arg tree "$TREE" --arg parent "$(git rev-parse HEAD)" --arg message "Changelog: $VERSION" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/commits" --input - -q .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$COMMIT" > /dev/null
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"  # the required test check
          if URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Changelog: $VERSION" \
              --body "Moves the changelog.d/ files released in $VERSION into CHANGELOG.md. Merge it any time: the next release doesn't wait for it."); then
            echo "Changelog pull request: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            # the release is out and the next one doesn't need this, but CHANGELOG.md stays behind until it's merged
            OPEN="https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
            echo "Open the changelog pull request: $OPEN" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$VERSION is released, but its changelog pull request could not be opened: $OPEN"
            exit 1
          fi
