name: Windows (Japanese) QA

# The documented Windows install as a standard user named in Japanese, with the console in code page 932, then the
# dashboard in Edge in Japanese (docs/development.md, Continuous integration). Runs on demand; `source` is what
# `uv tool install` installs.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "pypi (the released interlatch) or wheel (built from this branch)"
        default: wheel

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: |
          uv run --locked python docs/demo/make_demo.py "$RUNNER_TEMP/demo"
          tar -C "$RUNNER_TEMP/demo" -czf "$RUNNER_TEMP/demo-home.tgz" home
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: demo-home
          path: ${{ runner.temp }}/demo-home.tgz

  japanese:
    needs: demo
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      SOURCE: ${{ inputs.source || 'wheel' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the tags: the wheel's version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: demo-home
          path: ${{ runner.temp }}
      - name: The QA scripts (and the wheel) in C:\qa
        shell: bash
        run: |
          mkdir -p /c/qa
          cp .github/windows-ja-qa/* /c/qa/
          # the PowerShell lines docs/install.md#windows gives, with the package to install as {SOURCE}
          awk '/^## Windows/{w=1} w && /^```powershell/{f=1; next} f && /^```/{exit} f' docs/install.md |
            sed -E 's/(uv tool install --python 3\.13) interlatch/\1 {SOURCE}/' > /c/qa/docs-lines.txt
          cat /c/qa/docs-lines.txt
          if [ "$SOURCE" = wheel ]; then
            uv build --wheel -o /c/qa/dist
            echo "INSTALL_FROM=$(cygpath -w "$(ls /c/qa/dist/*.whl)")" >> "$GITHUB_ENV"
          else
            echo "INSTALL_FROM=interlatch" >> "$GITHUB_ENV"
          fi
      - name: Install as the Japanese-named user, as the docs say
        shell: powershell
        run: C:\qa\driver.ps1 -Phase install -Source "$env:INSTALL_FROM"
      - name: What it printed
        if: always()
        shell: bash
        run: uv run --no-project python /c/qa/report.py
      - name: Screenshots in Edge, Japanese (the user's dashboard, then the demo's, run here)
        if: always()
        shell: bash
        run: |
          uv run --no-project --with playwright==1.52.0 python /c/qa/shots.py http://127.0.0.1:11530 /c/qa/shots ja-user || true
          mkdir -p /c/demo && tar --force-local -xzf "$(cygpath -u "$RUNNER_TEMP")/demo-home.tgz" -C /c/demo
          # in this step: a process a step starts in the background ends with the step
          INTERLATCH_HOME='C:\demo\home' uvx --from "$INSTALL_FROM" interlatch ui --port 8898 > /c/demo/ui.out 2> /c/demo/ui.err &
          uv run --no-project --with playwright==1.52.0 python /c/qa/shots.py http://127.0.0.1:8898 /c/qa/shots demo || true
      - name: The dashboards' own logs
        if: always()
        shell: powershell
        run: |
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object LocalPort -in 8898, 11530, 11524 |
            Format-Table LocalAddress, LocalPort, OwningProcess
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'interlatch' } |
            Format-Table ProcessId, ParentProcessId, CommandLine -Wrap
          foreach ($f in 'C:\demo\ui.out', 'C:\demo\ui.err', 'C:\qa\ui.out', 'C:\qa\ui.err') {
            if (Test-Path $f) { Write-Host "----- $f"; Get-Content -LiteralPath $f -Encoding UTF8 -Tail 40 }
          }
          Get-ChildItem C:\demo\home\logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "----- $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Encoding UTF8 -Tail 40 }
      - name: Uninstall as the same user
        if: always()
        shell: powershell
        run: C:\qa\driver.ps1 -Phase uninstall -Source "$env:INSTALL_FROM"
      - name: What uninstall printed
        if: always()
        shell: bash
        run: uv run --no-project python /c/qa/report.py | sed -n '/20-uninstall/,$p'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: windows-ja-${{ matrix.os }}
          path: C:\qa
