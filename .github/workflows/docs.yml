name: Docs

# Builds the documentation (docs/ and the READMEs, mkdocs.yml) so broken links and anchors fail before they reach
# main. Chatixia-AI/chronicle-site publishes it at interlatch.com/docs/: when the docs change on main, this
# asks that site to rebuild (it also rebuilds daily). The request needs the secret SITE_DISPATCH_TOKEN, a
# fine-grained token with Contents: write on chronicle-site; without it the step is skipped.

on:
  push:
    branches: [main]
    paths: [docs/**, README.md, README.ja.md, mkdocs.yml, packaging/macos/icon.png, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, README.md, README.ja.md, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv run --locked --only-group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ask chronicle-site to rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN isn't set; chronicle-site picks up the docs on its daily build."
            exit 0
          fi
          gh api repos/Chatixia-AI/chronicle-site/dispatches -f event_type=docs-updated
