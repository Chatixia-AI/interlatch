# An Interlatch hub for a team, with HTTPS and the team store (docs/docker.md):
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#   docker compose logs hub # the first admin's invite
#
# Caddy gets a certificate for INTERLATCH_DOMAIN (its DNS must point here, and ports 80 and 443 be open) and forwards
# to the hub. The hub shares Caddy's network, so its dashboard listens on 127.0.0.1 and nothing but Caddy reaches it.
# Postgres keeps the team store: what computers share, lessons merged across them, sent back to teammates.
#
# Caddy and Postgres are pinned to an exact version and digest, so the images can't change under you; Dependabot
# moves them forward here (docs/docker.md#update). Keep your own changes in compose.override.yaml, which Compose
# reads with this file, so a new copy of this one doesn't undo them.
#
# A .env written before Interlatch was renamed from Chronicle names its settings CHRONICLE_*: each one still counts
# when its INTERLATCH_* name isn't set. The names below that stay "chronicle" (the project, so its volumes, and the
# database and its user) are what a hub set up before the rename keeps its data under: changing them would start it
# empty. A fallback to a CHRONICLE_* name never ends in :? (required): Compose checks a nested :? even when the
# INTERLATCH_* name is set, so a new .env would fail. The hub stops with what to set when the domain or admin is missing.
name: chronicle

services:
  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # localhost keeps Caddy up without a domain, so `docker compose logs hub` can say to set it
      INTERLATCH_DOMAIN: ${INTERLATCH_DOMAIN:-${CHRONICLE_DOMAIN:-localhost}}
      # a Caddyfile from before the rename reads this name, and an update downloads only compose.yaml
      CHRONICLE_DOMAIN: ${INTERLATCH_DOMAIN:-${CHRONICLE_DOMAIN:-localhost}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  hub:
    image: ghcr.io/chatixia-ai/interlatch-hub:${INTERLATCH_VERSION:-${CHRONICLE_VERSION:-latest}}
    restart: unless-stopped
    init: true
    network_mode: service:caddy
    depends_on:
      caddy:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      INTERLATCH_HUB_URL: https://${INTERLATCH_DOMAIN:-${CHRONICLE_DOMAIN:-}}
      INTERLATCH_HOST: 127.0.0.1
      INTERLATCH_ADMIN_EMAIL: ${INTERLATCH_ADMIN_EMAIL:-${CHRONICLE_ADMIN_EMAIL:-}}
      INTERLATCH_ADMIN_NAME: ${INTERLATCH_ADMIN_NAME:-${CHRONICLE_ADMIN_NAME:-}}
      INTERLATCH_HUB_NAME: ${INTERLATCH_HUB_NAME:-${CHRONICLE_HUB_NAME:-}}
      INTERLATCH_TEAM_STORE: postgres
      PGHOST: postgres
      PGDATABASE: chronicle
      PGUSER: chronicle
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGSSLMODE: disable  # Postgres is reached only inside this compose network
    volumes:
      - hub-data:/data

  postgres:  # stays on 17: a new major version can't read the old one's data
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chronicle", "-d", "chronicle"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  caddy-data:
  caddy-config:
  hub-data:
  postgres-data:
