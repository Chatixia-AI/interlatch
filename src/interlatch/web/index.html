<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interlatch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e5ecf5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#05121f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Interlatch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
  <script src="boot.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <div class="titlestrip drag-region" id="titlestrip">
      <a class="brand" href="#/" aria-label="Interlatch home">
        <img src="icon.png" width="22" height="22" alt="" aria-hidden="true">
        <span>Interlatch</span>
      </a>
    </div>
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="stage">
      <div class="edge" aria-hidden="true"></div>
      <div class="hub-band" id="hub-band" role="note" hidden></div>
      <div class="toolbar drag-region" id="toolbar">
        <div class="glass">
          <button class="icon-btn" id="sidebar-btn" type="button" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar"></button>
          <button class="icon-btn" id="back-btn" type="button" title="Back" aria-label="Back"></button>
          <button class="icon-btn" id="fwd-btn" type="button" title="Forward" aria-label="Forward"></button>
        </div>
        <div class="crumbs drag-region" id="crumbs"></div>
        <button class="glass search-pill" id="search-pill" type="button" aria-label="Search or jump to (⌘K)">
          <span class="sp-label">Search or jump to…</span><kbd>⌘K</kbd>
        </button>
        <div class="glass tinted"><button class="text-btn" id="sync-btn" type="button" title="Sync transcripts and process the analysis queue">Sync</button></div>
      </div>
      <div class="loadbar" id="loadbar" aria-hidden="true" hidden><i></i></div>
      <div class="loadnote glass" id="loadnote" role="status" aria-live="polite" hidden></div>
      <!-- the first page's placeholder, until app.js has its data; render() replaces it -->
      <main id="app" tabindex="-1" aria-busy="true">
        <div class="skeleton" aria-hidden="true">
          <div class="sk-head"><i class="sk sk-title"></i><i class="sk sk-sub"></i></div>
          <div class="sk-filters"><i class="sk sk-seg"></i><i class="sk sk-seg wide"></i></div>
          <div class="kpis">
            <div class="tile hero"><i class="sk sk-label"></i><i class="sk sk-big"></i><i class="sk sk-line"></i><i class="sk sk-line short"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
            <div class="tile"><i class="sk sk-label"></i><i class="sk sk-value"></i><i class="sk sk-foot"></i></div>
          </div>
          <div class="card"><i class="sk sk-label"></i><i class="sk sk-line"></i><i class="sk sk-line"></i><i class="sk sk-line short"></i></div>
        </div>
      </main>
    </div>
    <footer class="statusbar" id="statusbar">
      <div class="st-left">
        <span id="status-hub" hidden></span>
        <button type="button" id="status-pill" title="Background work"></button>
        <span id="status-queue"></span>
      </div>
      <div class="st-right">
        <span id="status-sync"></span>
        <span id="status-version"></span>
        <button type="button" id="status-update" hidden></button>
        <button type="button" id="lang-btn" title="日本語に切り替え" aria-label="日本語に切り替え" lang="ja">日本語</button>
        <button type="button" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </footer>
  </div>
  <div id="palette" hidden></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="update-note" role="status" aria-live="polite" hidden></div>
  <div id="activity" role="dialog" aria-label="Activity" hidden></div>
  <script src="rough.js"></script>
  <script src="ja.js"></script>
  <script src="i18n.js"></script>
  <script src="learning.js"></script>
  <script src="app.js"></script>
</body>
</html>
