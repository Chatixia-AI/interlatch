<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Interlatch</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icon-48.png" alt="" width="24" height="24">
  <b>Interlatch</b>
  <a id="dashboard" class="out" target="_blank" rel="noopener" data-i18n="dashboard" hidden></a>
  <button id="theme" class="icon" type="button" data-i18n-title="theme" data-i18n-label="theme">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
  </button>
</header>
<main>
  <section id="status" class="status" role="status" data-state="checking">
    <div class="st-head"><span class="dot" aria-hidden="true"></span><b id="st-title" data-i18n="checking"></b></div>
    <p id="st-detail" hidden></p>
    <a id="st-cta" class="cta" target="_blank" rel="noopener" data-i18n="stInstallCta" hidden></a>
    <p id="st-installed" data-i18n="stInstalled" hidden></p>
    <div id="st-cmd" class="cmd" hidden><code>interlatch ui --open</code><button id="copy" type="button" data-i18n="copy"></button></div>
    <p id="st-port" class="hint" data-i18n="portHint" hidden></p>
  </section>
  <section id="sites">
    <h2><span data-i18n="sites"></span><a id="how" class="how" target="_blank" rel="noopener" data-i18n-title="howItWorks" data-i18n-label="howItWorks">?</a></h2>
    <div class="site" data-site="claude-ai"><a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a><span class="line"></span></div>
    <div class="site" data-site="chatgpt"><a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT</a><span class="line"></span></div>
  </section>
  <p id="note" class="hint bad" data-i18n="noTab" hidden></p>
  <p id="result" class="hint" role="status" hidden></p>
  <div id="actions" class="row">
    <button id="sync" class="primary" type="button" data-i18n="syncNow"></button>
    <label class="check"><input id="paused" type="checkbox"> <span data-i18n="pausedLabel"></span></label>
  </div>
  <details>
    <summary data-i18n="settings"></summary>
    <label><span data-i18n="overlayLabel"></span> <input id="overlay" type="checkbox"></label>
    <label><span data-i18n="portLabel"></span> <input id="port" type="number" min="1" max="65535" placeholder="11524"></label>
    <label><span data-i18n="daysLabel"></span> <input id="days" type="number" min="1" max="3650" placeholder="30"></label>
    <button id="reset" type="button" data-i18n="reset" data-i18n-title="resetTitle"></button>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
