<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Interlatch</title>
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="welcome.css">
</head>
<body>
<header>
  <img src="icon-48.png" alt="" width="24" height="24">
  <b>Interlatch</b>
  <button id="theme" class="icon" type="button" data-i18n-title="theme" data-i18n-label="theme">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
  </button>
</header>
<main>
  <h1 data-i18n="wlTitle"></h1>
  <p data-i18n="wlIntro"></p>
  <dl>
    <dt data-i18n="wlReadsTitle"></dt><dd data-i18n="wlReads"></dd>
    <dt data-i18n="wlGoesTitle"></dt><dd data-i18n="wlGoes"></dd>
    <dt data-i18n="wlThenTitle"></dt><dd data-i18n="wlThen"></dd>
    <dt data-i18n="wlStopTitle"></dt><dd data-i18n="wlStop"></dd>
  </dl>
  <p id="needs" class="hint" hidden><span data-i18n="wlNeeds"></span> <a id="install" target="_blank" rel="noopener" data-i18n="stInstall"></a></p>
  <div id="choice" class="row">
    <button id="start" class="primary" type="button" data-i18n="wlStart"></button>
    <button id="later" type="button" data-i18n="wlLater"></button>
  </div>
  <p id="done" class="done" role="status" hidden></p>
  <p class="hint"><a id="privacy" target="_blank" rel="noopener" data-i18n="wlPrivacy"></a></p>
</main>
<script src="welcome.js"></script>
</body>
</html>
