[project]
name = "interlatch-enterprise"
version = "0.0.0"
description = "Interlatch Enterprise: single sign-on, policies, audit export and admin reports for Interlatch's team hub."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Interlatch-Enterprise"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Tam" }]
dependencies = ["interlatch"]

[project.urls]
Repository = "https://github.com/Chatixia-AI/interlatch/tree/main/ee"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interlatch_ee"]
